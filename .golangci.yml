version: "2"
linters:
  default: standard
  enable:
    - revive
    # A verifier is what a gateway trusts; it gets the security and
    # correctness linters, not just the standard set.
    - gosec
    - errorlint
    - nilerr
    - copyloopvar
    - makezero
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already in the standard set.
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, revive, gosec]
formatters:
  enable:
    - gofmt
