site_name: scout-reporting
site_description: The attestation format, offline verifier and schema for scout's evidence.
site_url: https://sebastienrousseau.com/scout-reporting/
repo_url: https://github.com/sebastienrousseau/scout-reporting
repo_name: sebastienrousseau/scout-reporting
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - The format: format.md
  - Verifying a statement: verify.md
  - Benchmarks: BENCHMARKS.md
  - Decision records:
      - Index: adr/README.md
      - 0001 The verifier in its own module: adr/0001-verifier-in-its-own-module.md
